<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>बाबा अकरम खान बंगाली | काला इल्म के माहिर</title>

<meta name="description"
content="बाबा अकरम खान बंगाली से प्रेम, विवाह, रिश्ते, कुंडली, काला इल्म एवं व्यक्तिगत परामर्श के लिए WhatsApp पर संपर्क करें।">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:
    radial-gradient(
        circle at 50% 0%,
        rgba(93,38,122,.18),
        transparent 30%
    ),
    #08050e;

    color:#f4eee2;

    font-family:
    "Noto Sans Devanagari",
    sans-serif;

    line-height:1.7;

    overflow-x:hidden;

    padding-bottom:72px;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{

    width:min(
        1100px,
        calc(100% - 30px)
    );

    margin:auto;
}


/* =====================================================
   VARIABLES
===================================================== */

:root{

    --dark:#08050e;

    --dark2:#10091a;

    --purple:#241131;

    --purple2:#321541;

    --gold:#e1ad50;

    --gold-light:#f6d98c;

    --cream:#fff7e4;

    --text:#eee7dc;

    --muted:#aaa4ae;

    --green:#11c85d;

    --green-dark:#079d48;

    --red:#bd1019;

    --border:
    rgba(225,173,80,.25);

}


/* =====================================================
   STAR BACKGROUND
===================================================== */

.stars{

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.5;

    background-image:
    radial-gradient(
        circle,
        rgba(255,255,255,.85) 1px,
        transparent 1.5px
    );

    background-size:
    95px 95px;

}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar{

    height:36px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#050308;

    border-bottom:
    1px solid
    rgba(225,173,80,.13);

    color:var(--gold-light);

    font-size:10px;

    letter-spacing:.5px;

}


/* =====================================================
   NAV
===================================================== */

.nav{

    position:absolute;

    top:36px;

    left:0;

    width:100%;

    z-index:50;

    padding:15px 0;

}

.nav-inner{

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.logo{

    display:flex;

    align-items:center;

    gap:10px;

}

.logo img{

    width:52px;

    height:52px;

    object-fit:contain;

    border-radius:50%;

    background:white;

    border:
    1px solid
    var(--gold);

}

.logo-name{

    font-family:"Amiri",serif;

    font-size:21px;

    font-weight:700;

    color:var(--cream);

}

.nav-wa{

    border:
    1px solid
    var(--border);

    border-radius:30px;

    padding:8px 15px;

    font-size:11px;

    font-weight:700;

    color:var(--gold-light);

    background:
    rgba(0,0,0,.25);

}


/* =====================================================
   HERO
===================================================== */

.hero{

    min-height:720px;

    position:relative;

    display:flex;

    align-items:center;

    overflow:hidden;

    padding:
    135px 0
    75px;

}

.hero-bg{

    position:absolute;

    inset:0;

    z-index:-3;

    background:

    linear-gradient(
        90deg,
        rgba(7,3,12,.97) 0%,
        rgba(7,3,12,.91) 42%,
        rgba(7,3,12,.58) 100%
    ),

    url(
    "https://img.sanishtech.com/u/02db15b2db3873f84a53ffc9f2c28cae.jpg"
    );

    background-size:cover;

    background-position:center;

}

.hero:after{

    content:"";

    position:absolute;

    inset:0;

    z-index:-2;

    background:
    linear-gradient(
        to bottom,
        transparent 65%,
        #08050e 100%
    );

}

.hero-content{

    max-width:720px;

}

.arabic{

    color:var(--gold-light);

    font-family:"Amiri",serif;

    font-size:24px;

    margin-bottom:5px;

}

.hero-badge{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:
    7px 15px;

    border:
    1px solid
    var(--border);

    border-radius:30px;

    color:var(--gold-light);

    background:
    rgba(0,0,0,.22);

    font-size:10px;

    font-weight:700;

    margin-bottom:18px;

}

.hero-badge i{

    width:7px;

    height:7px;

    border-radius:50%;

    background:var(--gold);

}

h1{

    font-family:"Amiri",serif;

    font-size:
    clamp(
        50px,
        7vw,
        80px
    );

    line-height:1.02;

    color:var(--cream);

    margin-bottom:18px;

}

h1 span{

    color:var(--gold-light);

}

.hero-description{

    max-width:650px;

    color:#d2cdd4;

    font-size:14px;

    line-height:1.95;

    margin-bottom:25px;

}


/* =====================================================
   WHATSAPP PRIMARY BUTTON
===================================================== */

.whatsapp-button{

    width:100%;

    min-height:68px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:
    8px 15px
    8px 19px;

    border-radius:50px;

    background:
    linear-gradient(
        135deg,
        #11c95d,
        #08aa4d
    );

    border:
    1px solid
    rgba(119,255,171,.55);

    box-shadow:
    0 10px 35px
    rgba(11,205,91,.18);

    color:#fff;

    transition:.25s;

}

.whatsapp-button:hover{

    transform:translateY(-2px);

    box-shadow:
    0 14px 40px
    rgba(11,205,91,.30);

}

.wa-left{

    display:flex;

    align-items:center;

    gap:13px;

}

.wa-icon{

    width:51px;

    height:51px;

    flex-shrink:0;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:#fff;

    color:#09aa4d;

    font-size:26px;

}

.wa-info{

    display:flex;

    flex-direction:column;

    line-height:1.25;

}

.wa-title{

    font-size:18px;

    font-weight:900;

}

.wa-sub{

    font-size:10px;

    opacity:.9;

    margin-top:3px;

}

.now{

    background:#fff;

    color:#087d3c;

    padding:
    10px 14px;

    border-radius:30px;

    font-size:10px;

    font-weight:900;

}


/* =====================================================
   CALL BUTTON
===================================================== */

.call-button{

    width:100%;

    min-height:47px;

    margin-top:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    border:
    1px solid
    rgba(255,255,255,.13);

    background:
    rgba(255,255,255,.035);

    border-radius:10px;

    color:#e6e0e8;

    font-size:13px;

    font-weight:700;

}

.call-button span{

    color:#f1b650;

}


/* =====================================================
   HERO TRUST
===================================================== */

.trust{

    display:flex;

    flex-wrap:wrap;

    gap:16px;

    margin-top:19px;

    color:#aaa7ae;

    font-size:10px;

}

.trust span:before{

    content:"●";

    color:var(--gold);

    margin-right:5px;

}


/* =====================================================
   SECTION
===================================================== */

section{

    padding:
    80px 0;

    position:relative;

}

.section-heading{

    max-width:720px;

    margin:
    0 auto
    42px;

    text-align:center;

}

.section-label{

    color:var(--gold-light);

    font-size:10px;

    font-weight:800;

    letter-spacing:2px;

    margin-bottom:8px;

}

h2{

    font-family:"Amiri",serif;

    font-size:
    clamp(
        38px,
        5vw,
        57px
    );

    line-height:1.08;

    color:var(--cream);

    margin-bottom:12px;

}

.section-heading p{

    color:var(--muted);

    font-size:13px;

}


/* =====================================================
   SERVICE CARDS
===================================================== */

.services-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:16px;

}

.service-card{

    padding:
    28px 24px;

    min-height:245px;

    border:
    1px solid
    var(--border);

    border-radius:18px;

    background:

    linear-gradient(
        145deg,
        rgba(44,21,57,.65),
        rgba(11,6,17,.7)
    );

    position:relative;

    overflow:hidden;

}

.service-card:before{

    content:"";

    position:absolute;

    width:100px;

    height:100px;

    border-radius:50%;

    right:-42px;

    top:-42px;

    border:
    1px solid
    rgba(225,173,80,.15);

}

.service-icon{

    width:49px;

    height:49px;

    display:grid;

    place-items:center;

    border:
    1px solid
    var(--border);

    border-radius:14px;

    color:var(--gold-light);

    font-size:22px;

    margin-bottom:16px;

}

.service-card h3{

    font-family:"Amiri",serif;

    font-size:27px;

    color:var(--cream);

    margin-bottom:7px;

}

.service-card p{

    color:var(--muted);

    font-size:12px;

    line-height:1.9;

}


/* =====================================================
   MID CTA
===================================================== */

.mid-cta{

    margin-top:28px;

    max-width:620px;

    margin-left:auto;

    margin-right:auto;

}


/* =====================================================
   ABOUT / NEW IMAGE
===================================================== */

.about{

    display:grid;

    grid-template-columns:
    .9fr 1.1fr;

    gap:55px;

    align-items:center;

}

.about-image{

    position:relative;

}

.about-image img{

    width:100%;

    height:530px;

    object-fit:cover;

    border-radius:22px;

    border:
    1px solid
    var(--border);

}

.frame{

    position:absolute;

    inset:
    12px -12px
    -12px 12px;

    border:
    1px solid
    rgba(225,173,80,.25);

    border-radius:22px;

    z-index:-1;

}

.about-content h2{

    text-align:left;

}

.about-content p{

    color:var(--muted);

    font-size:13px;

    line-height:2;

    margin-bottom:15px;

}

.points{

    display:grid;

    gap:10px;

    margin:
    24px 0;

}

.point{

    display:flex;

    gap:11px;

    padding:13px;

    border:
    1px solid
    rgba(255,255,255,.06);

    border-radius:11px;

    background:
    rgba(255,255,255,.025);

}

.point-check{

    color:var(--gold-light);

    font-weight:900;

}

.point strong{

    display:block;

    font-size:12px;

}

.point small{

    display:block;

    color:var(--muted);

    font-size:10px;

}


/* =====================================================
   KALA ILM
===================================================== */

.kala-section{

    background:

    radial-gradient(
        circle at center,
        rgba(87,35,113,.20),
        transparent 55%
    );

    border-top:
    1px solid
    rgba(225,173,80,.11);

    border-bottom:
    1px solid
    rgba(225,173,80,.11);

}

.kala-box{

    max-width:900px;

    margin:auto;

    padding:
    50px 30px;

    text-align:center;

    border:
    1px solid
    var(--border);

    border-radius:24px;

    background:

    linear-gradient(
        145deg,
        rgba(40,19,54,.72),
        rgba(8,4,13,.8)
    );

}

.kala-symbol{

    font-family:"Amiri",serif;

    color:var(--gold-light);

    font-size:32px;

}

.kala-box h2{

    margin-top:2px;

}

.kala-box p{

    max-width:720px;

    margin:
    0 auto
    23px;

    color:var(--muted);

    font-size:13px;

    line-height:2;

}

.kala-tags{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:9px;

    margin-bottom:27px;

}

.kala-tags span{

    padding:
    8px 14px;

    border:
    1px solid
    var(--border);

    border-radius:30px;

    color:#d8d1dc;

    font-size:10px;

}


/* =====================================================
   LOVE / WEDDING IMAGES
===================================================== */

.image-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:17px;

}

.image-card{

    height:480px;

    border-radius:22px;

    overflow:hidden;

    position:relative;

    border:
    1px solid
    var(--border);

}

.image-card img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:.5s;

}

.image-card:hover img{

    transform:scale(1.04);

}

.image-overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:flex-end;

    padding:27px;

    background:

    linear-gradient(
        to top,
        rgba(5,2,9,.96),
        transparent 65%
    );

}

.image-overlay h3{

    font-family:"Amiri",serif;

    color:var(--cream);

    font-size:29px;

}


/* =====================================================
   EXTRA SERVICES
===================================================== */

.service-list{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:13px;

}

.service-row{

    display:flex;

    align-items:center;

    gap:14px;

    padding:17px;

    border:
    1px solid
    rgba(225,173,80,.16);

    border-radius:13px;

    background:
    rgba(255,255,255,.025);

}

.service-row-icon{

    width:42px;

    height:42px;

    flex-shrink:0;

    display:grid;

    place-items:center;

    border-radius:12px;

    background:
    rgba(225,173,80,.08);

    color:var(--gold-light);

    border:
    1px solid
    var(--border);

}

.service-row strong{

    display:block;

    font-size:13px;

}

.service-row small{

    color:var(--muted);

    font-size:10px;

}


/* =====================================================
   PROCESS
===================================================== */

.steps{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:17px;

}

.step{

    padding:27px;

    border-top:
    1px solid
    var(--border);

}

.step-number{

    font-family:"Amiri",serif;

    color:var(--gold-light);

    font-size:42px;

}

.step h3{

    font-size:16px;

    margin:
    3px 0
    7px;

}

.step p{

    color:var(--muted);

    font-size:12px;

}


/* =====================================================
   FINAL CTA
===================================================== */

.final{

    padding:
    0 0
    85px;

}

.final-box{

    max-width:900px;

    margin:auto;

    padding:
    58px 25px;

    text-align:center;

    border:
    1px solid
    var(--border);

    border-radius:25px;

    background:

    radial-gradient(
        circle,
        rgba(225,173,80,.09),
        transparent 55%
    );

}

.final-box p{

    max-width:620px;

    margin:
    0 auto
    25px;

    color:var(--muted);

    font-size:13px;

}


/* =====================================================
   FOOTER
===================================================== */

footer{

    padding:
    35px 15px
    100px;

    text-align:center;

    border-top:
    1px solid
    rgba(225,173,80,.12);

    color:#85808a;

    font-size:10px;

}

.footer-name{

    font-family:"Amiri",serif;

    color:var(--gold-light);

    font-size:23px;

    margin-bottom:3px;

}


/* =====================================================
   FLOATING WHATSAPP
===================================================== */

.floating-wa{

    position:fixed;

    right:16px;

    bottom:86px;

    width:57px;

    height:57px;

    border-radius:50%;

    display:grid;

    place-items:center;

    z-index:80;

    background:
    linear-gradient(
        135deg,
        #13c95d,
        #08a84b
    );

    color:#fff;

    font-size:25px;

    box-shadow:
    0 8px 30px
    rgba(0,0,0,.55);

}


/* =====================================================
   FIXED BOTTOM BAR
===================================================== */

.bottom-bar{

    position:fixed;

    left:0;

    bottom:0;

    width:100%;

    height:70px;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    z-index:100;

    box-shadow:
    0 -8px 30px
    rgba(0,0,0,.55);

}

.bottom-call{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    background:
    linear-gradient(
        135deg,
        #ad0d16,
        #d01720
    );

    font-size:16px;

    font-weight:900;

}

.bottom-whatsapp{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    background:
    linear-gradient(
        135deg,
        #09a84b,
        #13c85d
    );

    font-size:16px;

    font-weight:900;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    .container{

        width:
        calc(100% - 28px);

    }

    .logo-name{

        display:none;

    }

    .nav{

        top:36px;

    }

    .nav-wa{

        padding:
        8px 12px;

        font-size:10px;

    }


    /* HERO */

    .hero{

        min-height:
        auto;

        padding:
        145px 0
        55px;

    }

    .hero-bg{

        background:

        linear-gradient(
            180deg,
            rgba(7,3,12,.68) 0%,
            rgba(7,3,12,.87) 65%,
            #08050e 100%
        ),

        url(
        "https://img.sanishtech.com/u/02db15b2db3873f84a53ffc9f2c28cae.jpg"
        );

        background-position:center;

    }

    h1{

        font-size:53px;

    }

    .hero-description{

        font-size:13px;

        line-height:1.9;

    }

    .whatsapp-button{

        min-height:67px;

    }

    .wa-title{

        font-size:17px;

    }

    .wa-sub{

        font-size:9px;

    }

    .trust{

        gap:9px;

        margin-top:17px;

    }


    /* SECTIONS */

    section{

        padding:
        68px 0;

    }

    .section-heading{

        margin-bottom:
        35px;

    }


    /* SERVICES */

    .services-grid{

        grid-template-columns:1fr;

    }

    .service-card{

        min-height:
        auto;

    }


    /* ABOUT */

    .about{

        grid-template-columns:1fr;

        gap:40px;

    }

    .about-image img{

        height:430px;

    }

    .about-content h2{

        text-align:left;

    }


    /* KALA */

    .kala-box{

        padding:
        40px 19px;

    }


    /* IMAGES */

    .image-grid{

        grid-template-columns:1fr;

    }

    .image-card{

        height:420px;

    }


    /* EXTRA SERVICES */

    .service-list{

        grid-template-columns:1fr;

    }


    /* PROCESS */

    .steps{

        grid-template-columns:1fr;

    }


    /* FLOAT */

    .floating-wa{

        bottom:83px;

    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media(max-width:390px){

    h1{

        font-size:47px;

    }

    .wa-title{

        font-size:15px;

    }

    .now{

        padding:
        9px 12px;

    }

}

</style>

</head>


<body>


<!-- =================================================
     TOP
================================================= -->

<div class="top-bar">

    ✦ निजी एवं गोपनीय परामर्श के लिए WhatsApp पर संपर्क करें ✦

</div>



<!-- =================================================
     NAV
================================================= -->

<nav class="nav">

    <div class="container nav-inner">


        <a href="#home" class="logo">

            <img
            src="https://img.sanishtech.com/u/5addf756a68858f29fd406e3cdbe9c71.jpg"

            <div class="logo-name">
                बाबा अकरम खान बंगाली
            </div>

        </a>


        <a
